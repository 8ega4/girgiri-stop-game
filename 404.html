<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <title>ギリギリで止めろ！</title>
    <link rel="canonical" href="https://girigiri-stop-game.pages.dev/" />
    <script>
      (() => {
        const destinationOrigin = "https://girigiri-stop-game.pages.dev";
        const legacyBase = "/girgiri-stop-game";
        const currentPath = window.location.pathname;
        const destinationPath =
          currentPath === legacyBase || currentPath === `${legacyBase}/`
            ? "/"
            : currentPath.startsWith(`${legacyBase}/`)
              ? currentPath.slice(legacyBase.length)
              : currentPath;
        const destination =
          destinationOrigin +
          destinationPath +
          window.location.search +
          window.location.hash;
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <main>
      <p>ゲームを新しいURLへ移動しました。</p>
      <p>
        自動で移動しない場合は、
        <a href="https://girigiri-stop-game.pages.dev/">
          「ギリギリで止めろ！」を開く
        </a>
      </p>
    </main>
  </body>
</html>
